        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700;800&display=swap');
        *{font-family:"Space Grotesk", system-ui, sans-serif}
        .display{font-family:"Syne", sans-serif}
        .ultra-grid{
          display:grid;
          grid-template-columns:300px 1fr 300px;
          gap:16px;
          width:100%;
          max-width:1400px;
          margin:0 auto;
          min-height:85vh;
          align-items:stretch;
        }
        .ultra-col{
          min-width:0;
          min-height:600px;
          flex-shrink:0;
          display:flex;
          flex-direction:column;
        }
        .blogger-fix{
          width:100vw;
          margin-left:calc(50% - 50vw);
          display:flex;
          justify-content:center;
          padding:16px;
          box-sizing:border-box;
        }
        @media (max-width:1100px){
          .ultra-grid{
            grid-template-columns:1fr;
            grid-template-rows:auto auto auto;
          }
          .ultra-col{ min-height:auto; }
          .ultra-col.center{ min-height:500px; }
          .blogger-fix{padding:8px;}
        }
        .glass{
          background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
          backdrop-filter: blur(18px);
          -webkit-backdrop-filter: blur(18px);
          border:1px solid rgba(255,255,255,0.12);
          box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .petal{
          position:absolute;
          top:-5%;
          animation-name: petalFall;
          animation-timing-function: linear;
          animation-iteration-count: infinite;
          user-select:none;
          filter: drop-shadow(0 2px 4px rgba(255,42,109,0.4));
        }
        @keyframes petalFall{
          0%{ transform: translateY(-10vh) translateX(0) rotate(0deg) }
          25%{ transform: translateY(25vh) translateX(20px) rotate(90deg) }
          50%{ transform: translateY(50vh) translateX(-15px) rotate(180deg) }
          100%{ transform: translateY(110vh) translateX(10px) rotate(720deg) }
        }
        .bubble{
          position:absolute;
          bottom:-10%;
          border-radius:50%;
          background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), rgba(255,42,109,0.18) 30%, rgba(120,80,255,0.12) 70%, transparent);
          border:1px solid rgba(255,255,255,0.15);
          animation: bubbleUp linear infinite;
          backdrop-filter: blur(2px);
        }
        @keyframes bubbleUp{
          0%{ transform: translateY(0) scale(0.8); opacity:0 }
          10%{ opacity:0.7 }
          90%{ opacity:0.5 }
          100%{ transform: translateY(-110vh) scale(1.2); opacity:0 }
        }
        .aurora-layer{
          background:
            radial-gradient(600px 400px at 20% 10%, rgba(255,42,109,0.25), transparent 60%),
            radial-gradient(800px 500px at 80% 20%, rgba(120,80,255,0.25), transparent 60%),
            radial-gradient(700px 600px at 50% 90%, rgba(255,100,180,0.15), transparent 70%);
          animation: auroraMove 12s ease-in-out infinite alternate;
        }
        @keyframes auroraMove{
          0%{ filter: hue-rotate(0deg) blur(0px) }
          100%{ filter: hue-rotate(25deg) blur(1px) }
        }
        .confetti-piece{
          position:absolute;
          top:-10px;
          width:8px;
          height:14px;
          border-radius:2px;
          animation: confettiFall 2.8s ease-in forwards;
        }
        @keyframes confettiFall{
          0%{ transform: translateY(-20px) rotate(0deg) }
          100%{ transform: translateY(105vh) rotate(720deg) }
        }
        .gold-text{
          background: linear-gradient(90deg, #ffd700 0%, #fff6a0 20%, #ffb800 40%, #ffd700 60%, #ffec8a 80%, #d4af37 100%);
          -webkit-background-clip:text;
          background-clip:text;
          color:transparent;
          filter: drop-shadow(0 0 12px rgba(255,215,0,0.6));
        }
        .red-pulse{
          animation: redPulse 1.6s ease-in-out infinite;
        }
        @keyframes redPulse{
          0%,100%{ box-shadow: 0 0 0 0 rgba(255,42,109,0.7), 0 0 30px rgba(255,42,109,0.6) }
          50%{ box-shadow: 0 0 0 18px rgba(255,42,109,0), 0 0 50px rgba(255,42,109,0.9) }
        }
        ::-webkit-scrollbar{ width:6px; height:6px }
        ::-webkit-scrollbar-thumb{ background: rgba(255,42,109,0.35); border-radius:10px }
