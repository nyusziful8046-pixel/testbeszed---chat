function detectDevice() {
  const ua = navigator.userAgent;
  if (/iPad|iPhone/.test(ua)) return "📱 telefon";
  if (/Android.*Mobile/.test(ua)) return "📱 telefon";
  if (/Android/.test(ua)) return "📲 tablet";
  return "💻 számítógép";
}

function randomColor() {
  const colors = ["#a855f7","#e11d48","#f59e0b","#10b981","#3b82f6","#ec4899"];
  return colors[Math.floor(Math.random()*colors.length)];
}

async function firebaseFetch(url, method="GET", data=null) {
  try {
    const opts = {method, headers:{"Content-Type":"application/json"}};
    if (data) opts.body = JSON.stringify(data);
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    return json;
  } catch(e) {
    console.log("Firebase hiba", e, url);
    return null;
  }
}

async function initFirebase() {
  // Név bekérés ha nincs
  let name = localStorage.getItem("testbeszed_nev");
  if (!name) {
    const modal = document.createElement("div");
    modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px";
    modal.innerHTML = `<div style="background:linear-gradient(135deg,#2d1b4e,#1a1033);border:1px solid rgba(168,85,247,0.4);border-radius:24px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.6)"><h2 style="font-family:Georgia;font-size:22px;margin-bottom:8px;color:#fff">💜 Üdv a közösségben!</h2><p style="color:#ccc;font-size:13px;margin-bottom:16px">Írd be a neved, hogy lássanak a többiek</p><input id="nameInput" placeholder="Pl. Zsuzsa" style="width:100%;padding:12px 16px;border-radius:50px;border:1px solid rgba(168,85,247,0.3);background:rgba(0,0,0,0.4);color:#fff;outline:none;margin-bottom:12px"><button id="joinBtn" style="width:100%;padding:12px;border-radius:50px;border:none;background:linear-gradient(135deg,#e11d48,#a855f7);color:#fff;font-weight:700;cursor:pointer">💬 Belépés</button></div>`;
    document.body.appendChild(modal);
    await new Promise(resolve => {
      const input = modal.querySelector("#nameInput");
      const btn = modal.querySelector("#joinBtn");
      input.focus();
      const go = () => {
        const v = input.value.trim();
        if (v.length>=2) {
          localStorage.setItem("testbeszed_nev", v);
          modal.remove();
          resolve();
        } else input.style.borderColor="#e11d48";
      };
      btn.onclick=go;
      input.onkeydown=e=>{if(e.key==="Enter") go();};
    });
    name = localStorage.getItem("testbeszed_nev");
  }
  
  const savedColor = localStorage.getItem("testbeszed_szin") || randomColor();
  localStorage.setItem("testbeszed_szin", savedColor);
  userId = localStorage.getItem("testbeszed_userId") || (Date.now()+"_"+Math.random().toString(36).substr(2,6));
  localStorage.setItem("testbeszed_userId", userId);
  
  currentUser = {
    nev: name,
    szin: savedColor,
    eszkoz: detectDevice(),
    belepes: Date.now(),
    lastSeen: Date.now(),
    online: true
  };
  
  // Presence beírás
  await firebaseFetch(`${DB_URL}/presence/${userId}.json`, "PUT", currentUser);
  // Rendszer üzenet
  await firebaseFetch(MESSAGES_URL, "POST", {nev:"Rendszer", szoveg: `${name} belépett! Szia! 🎉`, ido: Date.now(), szin:"#fbbf24", userId:"rendszer", tip:"rendszer"});
  
  // Heartbeat 15s
  presenceInterval = setInterval(async ()=>{
    currentUser.lastSeen = Date.now();
    await firebaseFetch(`${DB_URL}/presence/${userId}.json`, "PUT", currentUser);
  }, 15000);
  
  // Polling presence 3s
  setInterval(refreshPresence, 3000);
  refreshPresence();
  
  // Polling messages 2s
  setInterval(refreshMessages, 2000);
  refreshMessages();
  
  // Before unload törlés
  window.addEventListener("beforeunload", ()=>{
    navigator.sendBeacon && navigator.sendBeacon(`${DB_URL}/presence/${userId}.json`, JSON.stringify(null));
    firebaseFetch(`${DB_URL}/presence/${userId}.json`, "DELETE");
  });
}

async function refreshPresence() {
  const data = await firebaseFetch(PRESENCE_URL);
  if (!data) return;
  presenceCache = data;
  const now = Date.now();
  const list = document.getElementById("userList");
  const countEl = document.getElementById("onlineCount");
  const countHeader = document.getElementById("onlineCountHeader");
  if (!list) return;
  
  // Tisztítás régi 90s
  for (const [id, u] of Object.entries(data)) {
    if (now - (u.lastSeen||0) > 90000 && id !== userId) {
      firebaseFetch(`${DB_URL}/presence/${id}.json`, "DELETE");
    }
  }
  
  const users = Object.entries(data).filter(([id,u])=> now - (u.lastSeen||0) < 90000);
  // Mindig Angelika
  let html = `<div class="user-card angelika"><div class="user-name">👼 Angelika ✨ <span style="font-size:10px;background:#fbbf24;color:#000;padding:2px 6px;border-radius:20px">AI Lélek Társ</span></div><div class="user-meta">Mindig itt vagyok 💜</div><div style="font-size:11px;margin-top:6px;color:#fde68a">Szia, itt vagyok, ha lelked szeretne beszélni...</div><button class="btn-private btn-private-yellow" onclick="openPrivate('angelika','Angelika')">💬 Privát Angelikával</button></div>`;
  
  // Saját
  if (currentUser) {
    html += `<div class="user-card me"><div class="user-name">👤 ${currentUser.nev} <span style="font-size:10px;background:#22c55e;color:#fff;padding:2px 6px;border-radius:20px">TE</span></div><div class="user-meta">${currentUser.eszkoz} ● online</div></div>`;
  }
  
  users.forEach(([id,u])=>{
    if (id===userId) return;
    const isAngelika = u.nev && u.nev.toLowerCase().includes("angelika");
    if (isAngelika) return;
    html += `<div class="user-card"><div class="user-name" style="color:${u.szin||'#a855f7'}">🟢 ${u.nev}</div><div class="user-meta">${u.eszkoz||"💻"} ● online ● ${new Date(u.belepes||now).toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})}</div><button class="btn-private" onclick="openPrivate('${id}','${u.nev.replace(/'/g,"\'")}')">💬 PRIVÁT</button></div>`;
  });
  
  list.innerHTML = html;
  if (countEl) countEl.textContent = users.length + 1; // + Angelika
  if (countHeader) countHeader.textContent = `ONLINE: ${users.length + 1}`;
}

async function refreshMessages() {
  const data = await firebaseFetch(MESSAGES_QUERY_URL);
  if (!data) return;
  const container = document.getElementById("messagesContainer");
  if (!container) return;
  
  const entries = Object.entries(data).sort((a,b)=> (a[1].ido||0)-(b[1].ido||0));
  let newKeys = [];
  entries.forEach(([key, m])=>{
    if (!lastMessageKeys.has(key)) newKeys.push(key);
  });
  
  if (newKeys.length===0 && container.children.length>0) return;
  
  let html = "";
  entries.forEach(([key, m])=>{
    lastMessageKeys.add(key);
    if (m.tip==="rendszer") {
      html += `<div class="msg system">✨ ${m.szoveg} <span style="font-size:10px;opacity:0.7">${new Date(m.ido).toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})}</span></div>`;
    } else if (m.userId===userId) {
      html += `<div class="msg me"><div class="msg-name">Te</div>${m.szoveg}<div class="msg-time">${new Date(m.ido).toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})} ✓✓</div></div>`;
    } else {
      const isAngelika = m.nev && m.nev.toLowerCase().includes("angelika");
      const cls = isAngelika ? "msg angelika" : "msg other";
      html += `<div class="msg ${isAngelika?"angelika":"other"}"><div class="msg-name" style="color:${m.szin||'#a855f7'}">${m.nev}</div>${m.szoveg}<div class="msg-time">${new Date(m.ido).toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})}</div></div>`;
    }
  });
  
  const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 150;
  container.innerHTML = html;
  if (isNearBottom) container.scrollTop = container.scrollHeight;
  
  // Angelika bot ha egyedül
  const onlineCount = Object.keys(presenceCache).filter(id=> Date.now() - (presenceCache[id].lastSeen||0) < 90000).length;
  if (onlineCount<=1 && newKeys.length>0) {
    const lastMsg = entries[entries.length-1]?.[1];
    if (lastMsg && lastMsg.userId!==userId && lastMsg.userId!=="angelika" && lastMsg.userId!=="rendszer") {
      const text = (lastMsg.szoveg||"").toLowerCase();
      const keywords = ["szeret","szerelem","magány","testbeszéd","érzelem","szív","lélek","hiány","szerelmes","félek","szomor","boldog","jelent","segíts","fáj","angelika","mit tegyek"];
      if (keywords.some(k=>text.includes(k)) || Math.random()<0.3) {
        setTimeout(async ()=>{
          const valaszok = ["Szia, itt vagyok, ha lelked szeretne beszélni...💜","A testbeszéd többet mond minden szónál - figyelj a tekintetére... 👀","Ha szereted, a szíved tudja, mielőtt az eszed kimondaná... ❤️","A magány nem azt jelenti, hogy egyedül vagy, hanem hogy vágyódsz... 🥰","Ha rád néz hosszan, az nem véletlen... 😍","A lélek emlékszik arra, amit az elme elfelejt... ✨","Ne félj érezni, az érzelmek vezetnek... 🌹","Ha fáj, az azt jelenti, hogy igazán éltél... 💜"];
          const valasz = valaszok[Math.floor(Math.random()*valaszok.length)];
          await firebaseFetch(MESSAGES_URL, "POST", {nev:"Angelika", szoveg: valasz, ido: Date.now(), szin:"#fbbf24", userId:"angelika", tip:"angelika"});
        }, 2000);
      }
    }
  }
}

function openPrivate(id, name) {
  alert(`Privát chat ${name}-val hamarosan! Most írj neki a közösbe: @${name} és csak ő válaszol! 💜`);
}

async function sendMessage() {
  const input = document.getElementById("messageInput");
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  if (!currentUser) return;
  input.value="";
  await firebaseFetch(MESSAGES_URL, "POST", {nev: currentUser.nev, szoveg: text, ido: Date.now(), szin: currentUser.szin, userId: userId, tip:"kozos"});
  // Frissítés azonnal
  setTimeout(refreshMessages, 500);
}

// Init
document.addEventListener("DOMContentLoaded", ()=>{
  initFirebase();
  const input = document.getElementById("messageInput");
  const btn = document.getElementById("sendBtn");
  if (input) input.addEventListener("keydown", e=>{if(e.key==="Enter") sendMessage();});
  if (btn) btn.addEventListener("click", sendMessage);
  
  // YouTube vezérlők
  const ytFrame = document.getElementById("youtubePlayer");
  let ytMuted=false;
  let ytVolume=70;
  function ytPost(cmd, args=[]) {
    if (!ytFrame) return;
    ytFrame.contentWindow.postMessage(JSON.stringify({event:"command",func:cmd,args:args}), "*");
  }
  document.getElementById("volDown")?.addEventListener("click", ()=>{ytVolume=Math.max(0,ytVolume-20); ytPost("setVolume",[ytVolume]); document.getElementById("volSlider").value=ytVolume;});
  document.getElementById("volUp")?.addEventListener("click", ()=>{ytVolume=Math.min(100,ytVolume+20); ytPost("setVolume",[ytVolume]); document.getElementById("volSlider").value=ytVolume;});
  document.getElementById("muteBtn")?.addEventListener("click", ()=>{ytMuted=!ytMuted; ytPost(ytMuted?"mute":"unMute");});
  document.getElementById("stopBtn")?.addEventListener("click", ()=>{ytPost("stopVideo");});
  document.getElementById("playBtn")?.addEventListener("click", ()=>{ytPost("playVideo");});
  document.getElementById("volSlider")?.addEventListener("input", e=>{ytVolume=parseInt(e.target.value); ytPost("setVolume",[ytVolume]);});
});
</script>
